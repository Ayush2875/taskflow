<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Ops Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Sticky header bar -->
  <header class="site-header">
    <div class="header-inner">
      <span class="eyebrow">Blinkit Ops</span>
      <h1>TaskFlow</h1>
    </div>
    <div class="header-right">
      <span class="header-status" id="connection-status">connecting…</span>
      <span class="user-chip" id="user-chip" hidden></span>
      <button type="button" class="btn-icon" id="logout-btn" hidden>Log out</button>
    </div>
  </header>

  <main>
    <!-- Non-blocking message banner (replaces alert() popups) -->
    <p class="notice" id="notice" role="status" hidden></p>

    <!-- Login / Register — shown only when logged out -->
    <section class="auth-panel" id="auth-panel" aria-labelledby="auth-heading">
      <div class="auth-tabs">
        <button type="button" class="tab active" id="tab-login">Log in</button>
        <button type="button" class="tab" id="tab-register">Register</button>
      </div>
      <h2 id="auth-heading">Log in to add or edit tickets</h2>

      <form id="auth-form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="auth-name">Name</label>
          <input type="text" id="auth-name" autocomplete="name" />
        </div>
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="text" id="auth-email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" />
        </div>
        <p class="field-error" id="auth-error" hidden></p>
        <button type="submit" class="btn-primary" id="auth-submit">Log in</button>
      </form>
    </section>

    <!-- Add-task form — shown only when logged in -->
    <section class="intake" id="intake" aria-labelledby="intake-heading" hidden>
      <h2 id="intake-heading">New ticket</h2>

      <form id="task-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Restock aisle 3 chillers" autocomplete="off" />
          <p class="field-error" id="title-error" hidden></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="due_date">Due</label>
            <input type="text" id="due_date" name="due_date" placeholder="e.g. tomorrow, 2026-08-10" autocomplete="off" />
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary">Add task</button>
      </form>
    </section>

    <!-- Task list — readable by everyone -->
    <section class="board" aria-labelledby="board-heading">
      <div class="board-header">
        <h2 id="board-heading">Open tickets</h2>
        <span class="task-count" id="task-count">0 tasks</span>
      </div>

      <div id="task-list" class="task-list">
        <!-- Task items are injected here by script.js via createElement/appendChild -->
      </div>

      <p class="empty-state" id="empty-state" hidden>No tickets yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
